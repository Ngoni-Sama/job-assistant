name: Deploy Worker

# Auto-deploys the Cloudflare Worker on every push to main that touches the
# backend. The FRONTEND is deployed by Vercel's own Git integration (connect the
# repo once in the Vercel dashboard, Root Directory = packages/frontend) — no
# secrets needed for that. See DEPLOY.md.
#
# Required GitHub secret: CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers template).
# accountId + KV id are committed in wrangler.toml, so that's the only secret.
on:
  push:
    branches: [main]
    paths:
      - "packages/backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (gate deploy on a clean build)
        run: npm run typecheck --workspace=packages/backend
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: packages/backend
