name = "job-assistant"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Workers AI — PDF→Markdown and CV↔job matching
[ai]
binding = "AI"

# KV — job cache + processed CV markdown
[[kv_namespaces]]
binding = "JOBS_CACHE"
id = "5ea4ce669eea485b97817519327c6446"

# R2 — raw CV uploads (OPTIONAL). Enable R2 in the Cloudflare dashboard, then:
#   npx wrangler r2 bucket create job-assistant-cvs
# and uncomment the block below. Without it, CVs are still processed to
# Markdown and cached in KV — only the raw PDF isn't retained.
# [[r2_buckets]]
# binding = "CV_BUCKET"
# bucket_name = "job-assistant-cvs"

# Cron — automated scraping every 6 hours
[triggers]
crons = ["0 */6 * * *"]

[vars]
DEFAULT_SCRAPE_URL = "https://vacancymail.co.zw/jobs/"
# SERPER_API_KEY is set via: npx wrangler secret put SERPER_API_KEY
