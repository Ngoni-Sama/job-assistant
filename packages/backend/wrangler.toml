name = "job-assistant"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# ===== TEST-ONLY HARDCODE — review before real launch =====
# Account ID is an identifier (not a secret), so it's safe to commit. This lets
# CI/CD skip the CLOUDFLARE_ACCOUNT_ID secret. Fine to leave, or remove and set
# the CLOUDFLARE_ACCOUNT_ID GitHub secret instead.
account_id = "1e90e6b99306ccd54c9a9eecf6793b02"
# ==========================================================

# Workers AI — PDF→Markdown and CV↔job matching
[ai]
binding = "AI"

# KV — job cache + processed CV markdown
[[kv_namespaces]]
binding = "JOBS_CACHE"
id = "5ea4ce669eea485b97817519327c6446"

# R2 — raw CV uploads (OPTIONAL). Enable R2 in the Cloudflare dashboard, then:
#   npx wrangler r2 bucket create job-assistant-cvs
# and uncomment the block below. Without it, CVs are still processed to
# Markdown and cached in KV — only the raw PDF isn't retained.
# [[r2_buckets]]
# binding = "CV_BUCKET"
# bucket_name = "job-assistant-cvs"

# Cron — automated scraping every 6 hours
[triggers]
crons = ["0 */6 * * *"]

[vars]
DEFAULT_SCRAPE_URL = "https://vacancymail.co.zw/jobs/"
# Comma-separated admin emails (match the Google sign-in email). Admins see the
# config panel (AI provider, API keys, feature flags).
ADMIN_EMAILS = "1ngoni.maphosa@gmail.com"
# Frontend origin used for Stripe Checkout success/cancel redirects.
APP_URL = "https://job-assistant-frontend-tau.vercel.app"
# STRIPE_SECRET_KEY + STRIPE_WEBHOOK_SECRET are set via `wrangler secret put`.
# SERPER_API_KEY is set via: npx wrangler secret put SERPER_API_KEY
